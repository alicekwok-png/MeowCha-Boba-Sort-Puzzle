<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#12100D">
  <title>Mortar &amp; Mew</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/icons/favicon-64.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mortar & Mew">
  <!-- 批次 1：開場必需，喺 HTML 層 preload，唔經遊戲 loader（Spec v2：導師貓單張 CHR_cat_idle） -->
  <link rel="preload" as="image" href="assets/company-logo.webp">
  <link rel="preload" as="image" href="assets/v2/cat_idle.webp?v=eca3efd1">
  <link rel="modulepreload" href="src/client/main.js?v=eca3efd1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap">
  <link rel="stylesheet" href="styles.css?v=eca3efd1">
</head>
<body>
<div id="app">

  <!-- ===== 開場：公司 Logo（純白）===== -->
  <section id="screen-logo" class="screen boot-logo">
    <img src="assets/company-logo.webp" alt="">
  </section>

  <!-- ===== 開場：遊戲 Loading（深色工房）===== -->
  <section id="screen-loading" class="screen boot-loading">
    <!-- 開場字標：舊圖係珍奶時期嘅「喵喵茶記」，新 wordmark 圖未交付，暫用文字 -->
    <div class="boot-wordmark" data-i18n-key="app.name" data-i18n-attr="aria-label" aria-label="Mortar &amp; Mew"><span class="wm-main" data-i18n="app.name">Mortar &amp; Mew</span><span class="wm-sub" data-i18n="app.subtitle">煉金工房 · 試劑分類</span></div>
    <img id="boot-mocha" class="boot-mocha" src="assets/v2/cat_idle.webp?v=eca3efd1" alt="">
    <div class="boot-bar"><div id="boot-fill" class="boot-fill"></div><span class="boot-straw"></span></div>
    <div id="boot-tip" class="boot-tip" data-i18n="extra.boot.tip1">正在點蠟燭…</div>
    <div id="boot-retry" class="boot-retry" data-i18n="extra.boot.retry" hidden>載入唔到，撳一下重試</div>
  </section>

  <!-- ===== 主畫面（煉金工房）===== -->
  <section id="screen-title" class="screen">
    <div class="title-bg"></div>
    <div class="title-content">
      <div id="cafe-banner" class="cafe-banner" hidden></div>
      <img class="title-mascot" src="assets/v2/cat_idle.webp?v=eca3efd1" alt="導師" data-i18n-key="extra.title.mascotAlt" data-i18n-attr="alt">
      <h1 class="logo"><span class="logo-main" data-i18n="app.name">Mortar &amp; Mew</span><span class="logo-sub" data-i18n="app.subtitle">煉金工房 · 試劑分類解謎</span></h1>
      <div class="menu">
        <button id="btn-continue" class="btn primary" data-i18n="menu.start">開始</button>
        <button id="btn-levels" class="btn" data-i18n="menu.levelSelect">關卡選擇</button>
        <button id="btn-practice" class="btn" data-i18n="menu.practice">練習模式</button>
        <button id="btn-help" class="btn ghost" data-i18n="menu.howToPlay">點樣玩？</button>
      </div>
      <div class="title-foot">
        <span class="coins"><img class="ico" src="assets/v2/ui_coin.webp?v=eca3efd1" alt="金幣" data-i18n-key="hud.coins" data-i18n-attr="alt"> <b id="coins-title">0</b></span>
        <span class="stars-total"><img class="ico" src="assets/v2/ui_star.webp?v=eca3efd1" alt="星" data-i18n-key="extra.title.starsAlt" data-i18n-attr="alt"> <b id="stars-title">0</b>/120</span>
        <button class="icon-btn img settings" id="btn-settings-title" aria-label="設定" title="設定" data-i18n-key="menu.settings" data-i18n-attr="aria-label|title"><img src="assets/v2/ui_sys_settings.webp?v=eca3efd1" alt=""></button>
      </div>
    </div>
  </section>

  <!-- ===== 關卡選擇 ===== -->
  <section id="screen-levels" class="screen">
    <header class="bar">
      <button class="icon-btn img" id="btn-levels-back" aria-label="返回" data-i18n-key="actions.back" data-i18n-attr="aria-label"><img src="assets/v2/ui_sys_back.webp?v=eca3efd1" alt=""></button>
      <h2 data-i18n="menu.levelSelect">關卡</h2>
      <span class="coins"><img class="ico" src="assets/v2/ui_coin.webp?v=eca3efd1" alt="金幣" data-i18n-key="hud.coins" data-i18n-attr="alt"> <b id="coins-levels">0</b></span>
    </header>
    <div id="level-grid" class="level-grid"></div>
  </section>

  <!-- ===== 遊戲（單張背景 + 版面欄）===== -->
  <section id="screen-game" class="screen">
    <div id="bg-layers" class="bg-layers" aria-hidden="true">
      <img id="bg-far" class="bg-far" alt="">
      <img id="bg-far-next" class="bg-far" alt="" hidden>
      <div id="bg-mid" class="bg-mid"></div>
      <canvas id="bg-ambient" class="bg-ambient"></canvas>
      <div id="bg-mask" class="bg-mask"></div>
    </div>

    <div class="game-col">
      <!-- 版面（用戶 2026-09-05，src/config/layout.js LAYOUT）：委託人行 18%（金幣 / 關卡 / 設定放喺兩端，唔獨立一行）· 盤面 72% · 道具列 10%（貓助手唔佔位，只喺交貨時彈出） -->
      <header class="zone zone-orders">
        <div class="hud">
          <div class="top-left">
            <button class="icon-btn img shop" id="btn-game-back" aria-label="返回工房" title="返回工房" data-i18n-key="extra.hud.backToLab" data-i18n-attr="aria-label|title"><img src="assets/v2/ui_sys_shop.webp?v=eca3efd1" alt=""></button>
            <span class="coins"><img class="ico" src="assets/v2/ui_coin.webp?v=eca3efd1" alt="金幣" data-i18n-key="hud.coins" data-i18n-attr="alt"> <b id="coins-game">0</b></span>
          </div>
          <div class="top-centre">
            <div class="level-title"><b id="game-level-no">第 1 關</b><span id="game-level-title"></span></div>
            <div class="pace" id="pace" title="步數 / 三星門檻" data-i18n-key="extra.hud.paceStatic" data-i18n-attr="title"><span class="pace-stars" id="pace-stars"></span><span class="pace-moves" id="pace-moves">0 步</span></div>
          </div>
          <div class="top-right"></div>   <!-- 保留做平衡，令中間關卡 / 步數置中（「尚有 N 單」2026-09-06 拎走） -->
        </div>
        <div class="customers" id="customers"></div>
      </header>
      <div class="zone zone-board">
        <canvas id="board"></canvas>
        <!-- v4 §3.2 貓助手 transient：只喺交貨 / 教學句時由右下滑入，CAT.showDurationMs 後淡出；其餘時間完全唔佔位 -->
        <div id="cat-pop" class="cat-pop" aria-live="polite" hidden>
          <img id="cat-img" src="assets/v2/cat_cheer.webp?v=eca3efd1" alt="導師" data-i18n-key="extra.title.mascotAlt" data-i18n-attr="alt">
        </div>
      </div>
      <!-- 道具列（用戶 2026-09-06：拎走「提示」同「撤銷」，設定由頂欄搬落嚟）：+樽（廣告加空樽，L11 起、盤面冇廣告樽剩低先出）· 重來 · 設定 -->
      <footer class="zone zone-actions">
        <button class="act ad" id="btn-add-cup" type="button" hidden aria-label="睇廣告加一隻空樽" title="睇廣告加一隻空樽" data-i18n-key="extra.hud.addCupAria" data-i18n-attr="aria-label|title"><img src="assets/v2/ui_item_addflask.webp?v=eca3efd1" alt=""><span data-i18n="extra.hud.addCup">+樽</span></button>
        <button class="act" id="btn-restart"><i>↻</i><span data-i18n="actions.restart">重來</span></button>
        <button class="act" id="btn-settings-game" aria-label="設定" title="設定" data-i18n-key="menu.settings" data-i18n-attr="aria-label|title"><img src="assets/v2/ui_sys_settings.webp?v=eca3efd1" alt=""><span data-i18n="menu.settings">設定</span></button>
      </footer>
    </div>
  </section>

  <!-- ===== Modal / Toast ===== -->
  <div id="modal" class="modal hidden"><div class="card" id="modal-card"></div></div>
  <div id="toast" class="toast hidden"></div>
</div>
<script type="module" src="src/client/main.js?v=eca3efd1"></script>
</body>
</html>
